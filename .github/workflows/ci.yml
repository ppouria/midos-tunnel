name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Verify modules
        run: go mod verify
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test -race -count=1 -timeout 10m -skip 'TestAuditTrail' ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o ../dist/midos-tunnel-${{ matrix.goarch }} .
          cd ../dist && sha256sum midos-tunnel-${{ matrix.goarch }} > midos-tunnel-${{ matrix.goarch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: midos-tunnel-linux-${{ matrix.goarch }}
          path: dist/
          retention-days: 14
